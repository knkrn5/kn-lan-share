<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/_css/unauth/unauth-style.css" />
    <title>Access Restricted · KN LAN Share</title>
    <script>
      (() => {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <p id="notification" role="status"></p>

    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      title="Toggle theme"
      aria-label="Toggle theme"
    >
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <main class="stage">
      <div class="card" id="card">
        <div class="lock-ring" aria-hidden="true">
          <div class="lock-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2.2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
              <circle cx="12" cy="16" r="1.3" />
              <path d="M12 17.4v.01" />
            </svg>
          </div>
        </div>

        <p class="eyebrow">Restricted area</p>
        <h1>Authentication required</h1>
        <p class="desc">
          This resource is protected by an access key. Enter the server password to continue.
        </p>

        <p class="req-path" id="req-path" title=""></p>

        <form id="unlock-form" novalidate>
          <label for="pwd-input">Access key</label>
          <div class="row">
            <input
              id="pwd-input"
              type="password"
              placeholder="Enter access key"
              autocomplete="current-password"
              spellcheck="false"
            />
            <button id="unlock-btn" type="submit">Unlock</button>
          </div>
          <p class="status" id="status" role="status"></p>
        </form>

        <div class="foot">
          <span>Protected by KN LAN Share</span>
          <span class="sep" aria-hidden="true"></span>
          <a href="/">Go to home</a>
        </div>
      </div>
    </main>

    <script src="/_js/unauth/unauth-script.js"></script>
  </body>
</html>
