<main class="layout">
  <section id="fileDownload" class="panel">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Browse</p>
        <h2>Files in directory</h2>
      </div>
      <div class="path-chip" title="${DownloadFolder}">
        <span class="path-dot"></span>
        <code>${DownloadFolder}</code>
      </div>
    </div>

    <div id="dirs" class="file-list-wrap">
      <ol class="file-list">
        ${DynamicHTML}
      </ol>
    </div>
  </section>

  <section id="fileUpload" class="panel panel-upload">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Transfer</p>
        <h2>Upload files</h2>
      </div>
    </div>

    <p class="upload-path">
      Saving to
      <code>${UploadFolder}</code>
    </p>

    <div class="upload-zone">
      <input title="upload files" type="file" id="fileInput" />
      <label for="fileInput" class="upload-drop">
        <span class="upload-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 16V4" />
            <polyline points="7 9 12 4 17 9" />
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
          </svg>
        </span>
        <span class="upload-title">Choose a file to upload</span>
        <span class="upload-hint">Click to browse from this device</span>
      </label>

      <button type="button" id="uploadButton" class="btn-primary">
        Upload
      </button>
    </div>

    <div id="progress" class="progress-block">
      <div class="progress-meta">
        <span>Progress</span>
        <p id="progressPercent">0%</p>
      </div>
      <progress id="uploadProgressBar" value="0" max="100"></progress>
    </div>
  </section>
</main>
